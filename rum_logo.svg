<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0e08;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d1a0e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5d98e;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#d4a33b;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#a66a1e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6b3410;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a33b;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#6b3410;stop-opacity:0.95" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5d98e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4a33b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="labelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef3d1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8b84b;stop-opacity:1" />
    </linearGradient>
    
    <!-- Filters -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="300" cy="300" r="280" fill="url(#bgGrad)" />
  <circle cx="300" cy="300" r="270" fill="none" stroke="#c47e2a" stroke-width="1.5" opacity="0.15"/>

  <!-- === RUM BOTTLE (left) === -->
  <g filter="url(#dropShadow)">
    <!-- Bottle body -->
    <path d="
      M 170 340
      L 170 250
      Q 170 230 190 230
      L 220 230
      L 220 170
      Q 220 140 250 140
      Q 280 140 280 170
      L 280 230
      L 310 230
      Q 330 230 330 250
      L 330 340
      Q 330 360 310 360
      L 190 360
      Q 170 360 170 340 Z"
      fill="url(#bottleGrad)"
      stroke="#4a250a"
      stroke-width="3"
    />
    
    <!-- Bottle neck highlight -->
    <path d="M 235 170 L 235 230 L 250 230 L 250 170 Q 250 145 260 140 L 245 140 Q 235 145 235 170 Z" 
      fill="rgba(255,255,255,0.15)" />
    
    <!-- Bottle body highlight -->
    <path d="M 185 250 L 185 340 Q 185 350 195 350 L 210 350 L 210 250 Z" 
      fill="rgba(255,255,255,0.12)" />

    <!-- Label on bottle -->
    <rect x="195" y="260" width="110" height="70" rx="6" fill="url(#labelGrad)" stroke="#8a4a1c" stroke-width="2" />
    <rect x="200" y="265" width="100" height="60" rx="4" fill="none" stroke="#8a4a1c" stroke-width="1" opacity="0.5" />
    
    <!-- Small 'R' on label -->
    <text x="250" y="305" font-family="'Georgia', serif" font-size="36" font-weight="bold" fill="#6b3410" text-anchor="middle">R</text>
  </g>

  <!-- === RUM GLASS (right) with liquid === -->
  <g filter="url(#dropShadow)">
    <!-- Glass shape -->
    <path d="
      M 360 220
      L 380 370
      Q 385 390 400 390
      Q 415 390 420 370
      L 440 220
      Q 440 200 420 200
      L 380 200
      Q 360 200 360 220 Z"
      fill="url(#glassGrad)"
      stroke="#ffffff"
      stroke-width="2"
      stroke-opacity="0.5"
    />
    
    <!-- Liquid inside glass -->
    <path d="
      M 368 270
      L 385 370
      Q 390 385 400 385
      Q 410 385 415 370
      L 432 270
      Q 432 260 420 260
      L 380 260
      Q 368 260 368 270 Z"
      fill="url(#liquidGrad)"
    />
    
    <!-- Liquid surface (top ellipse) -->
    <ellipse cx="400" cy="270" rx="32" ry="8" fill="#d4a33b" opacity="0.9" />
    <ellipse cx="400" cy="270" rx="30" ry="6" fill="#f5d98e" opacity="0.3" />

    <!-- Glass highlight -->
    <path d="M 370 230 L 385 350 Q 390 370 395 370 L 390 230 Z" 
      fill="rgba(255,255,255,0.15)" />
  </g>

  <!-- === DOWNLOAD ARROW (integrated between bottle and glass) === -->
  <g filter="url(#glow)">
    <!-- Arrow shaft (vertical) -->
    <rect x="328" y="160" width="24" height="140" rx="4" fill="url(#arrowGrad)" />
    
    <!-- Arrow head -->
    <polygon points="310,290 340,330 370,290" fill="url(#arrowGrad)" />
    
    <!-- Arrow base bar -->
    <rect x="300" y="330" width="80" height="16" rx="4" fill="url(#arrowGrad)" />
  </g>

  <!-- === RUM POUR (from bottle to glass) === -->
  <g>
    <!-- Pour stream -->
    <path d="M 310 230 Q 320 250 340 260 Q 360 270 370 270" 
      fill="none" stroke="#d4a33b" stroke-width="8" stroke-linecap="round" opacity="0.8" />
    <path d="M 310 230 Q 320 250 340 260 Q 360 270 370 270" 
      fill="none" stroke="#f5d98e" stroke-width="3" stroke-linecap="round" opacity="0.4" />
    
    <!-- Splash drops -->
    <circle cx="365" cy="275" r="4" fill="#d4a33b" opacity="0.7" />
    <circle cx="375" cy="280" r="2.5" fill="#d4a33b" opacity="0.6" />
    <circle cx="360" cy="282" r="3" fill="#d4a33b" opacity="0.5" />
  </g>

  <!-- Subtle decorative border -->
  <circle cx="300" cy="300" r="275" fill="none" stroke="#e8b84b" stroke-width="1" opacity="0.15" stroke-dasharray="10,10" />
</svg>