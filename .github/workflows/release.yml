# Release — cross-platform prebuilt installers on every `v*` tag.
#
# Push a tag like `v1.2.0` and this workflow builds Rum on three OSes, packages
# a native installer for each, and attaches them to the GitHub Release for that
# tag:
#
#   Linux    .deb  (nfpm) + .AppImage (linuxdeploy over build/bin/Rum)
#   Windows  Rum-Setup.exe (Inno Setup over installer.iss) — raw .exe fallback
#   macOS    Rum-macOS-unsigned.dmg (UNSIGNED, best-effort, untested)
#
# NOTE: this pipeline can only be fully proven on a real tag push (especially the
# macOS .dmg, which has no local equivalent in this repo's dev environment). It
# is written to be correct and heavily commented so the first tag push works.
name: Release

on:
  push:
    tags:
      - 'v*'

# The final job creates a GitHub Release and uploads assets, so it needs write.
permissions:
  contents: write

env:
  WAILS_VERSION: v2.12.0
  APP_NAME: Rum

jobs:
  # ---------------------------------------------------------------------------
  # LINUX — wails build, then a .deb (nfpm) and an .AppImage (linuxdeploy).
  # ---------------------------------------------------------------------------
  linux:
    name: linux (deb + AppImage)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            go.sum
            backend/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install WebKit/GTK + packaging dependencies
        run: |
          sudo apt-get update
          # Build deps for Wails (GTK3 + WebKit2GTK 4.1) plus FUSE, which the
          # AppImage runtime needs to be *executed* on the runner.
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            fuse libfuse2 file desktop-file-utils

      - name: Install the Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Derive version from the tag
        id: ver
        run: |
          # v1.2.3 -> 1.2.3 ; nfpm/AppImage want a bare version string.
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build the desktop app (wails)
        run: |
          wails build -clean -tags webkit2_41 -platform linux/amd64 \
            -ldflags "-X main.version=${{ steps.ver.outputs.version }}"
          test -f build/bin/${APP_NAME}

      # --- .deb via nfpm ---------------------------------------------------
      # `wails build` does NOT emit packages by itself on this version; the
      # `nfpm` block in wails.json is only metadata. So we install nfpm and feed
      # it a small config generated here. The metadata below mirrors wails.json's
      # `nfpm` block (which this workflow is not allowed to edit). If wails.json's
      # nfpm metadata changes, update the env values here to match.
      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Stage files and write nfpm config
        run: |
          mkdir -p dist nfpm-root/usr/bin \
                   nfpm-root/usr/share/applications \
                   nfpm-root/usr/share/icons/hicolor/512x512/apps
          install -m 0755 build/bin/${APP_NAME} nfpm-root/usr/bin/${APP_NAME}

          # Desktop entry (absolute Exec to the packaged binary location).
          cat > nfpm-root/usr/share/applications/${APP_NAME}.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=${APP_NAME}
          Comment=Powerful, fast and modern download manager
          Exec=/usr/bin/${APP_NAME}
          Icon=${APP_NAME}
          Terminal=false
          Categories=Network;FileTransfer;Utility;
          StartupWMClass=${APP_NAME}
          EOF

          # Icon (prefer the squared appicon, fall back to build/icon.png).
          if [ -f build/appicon.png ]; then
            cp build/appicon.png nfpm-root/usr/share/icons/hicolor/512x512/apps/${APP_NAME}.png
          elif [ -f build/icon.png ]; then
            cp build/icon.png nfpm-root/usr/share/icons/hicolor/512x512/apps/${APP_NAME}.png
          fi

          cat > nfpm.yaml <<EOF
          name: ${APP_NAME}
          arch: amd64
          platform: linux
          version: "${{ steps.ver.outputs.version }}"
          section: utils
          priority: optional
          maintainer: "tiredbooy <mahdykazemyo1i2@gmail.com>"
          description: "Rum Is a Fast & Modern Download Manager Written In golang."
          vendor: "tiredbooy"
          homepage: "https://tiredbooy.ir"
          license: "MIT"
          contents:
            - src: nfpm-root/usr/bin/${APP_NAME}
              dst: /usr/bin/${APP_NAME}
            - src: nfpm-root/usr/share/applications/${APP_NAME}.desktop
              dst: /usr/share/applications/${APP_NAME}.desktop
            - src: nfpm-root/usr/share/icons/hicolor/512x512/apps/${APP_NAME}.png
              dst: /usr/share/icons/hicolor/512x512/apps/${APP_NAME}.png
          EOF

      - name: Build the .deb
        run: |
          nfpm pkg --packager deb --config nfpm.yaml --target \
            "dist/${APP_NAME}_${{ steps.ver.outputs.version }}_amd64.deb"

      # --- .AppImage via linuxdeploy --------------------------------------
      - name: Build the AppImage
        run: |
          set -euo pipefail
          # Tools (downloaded as AppImages themselves).
          curl -fsSL -o linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy

          # Assemble an AppDir from the wails output.
          APPDIR="AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin"
          install -m 0755 build/bin/${APP_NAME} "$APPDIR/usr/bin/${APP_NAME}"

          ICON_ARG=()
          if [ -f build/appicon.png ]; then ICON_ARG=(--icon-file build/appicon.png);
          elif [ -f build/icon.png ]; then ICON_ARG=(--icon-file build/icon.png); fi

          # linuxdeploy reads a .desktop to learn the app name / Exec / icon.
          cat > ${APP_NAME}.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=${APP_NAME}
          Comment=Powerful, fast and modern download manager
          Exec=${APP_NAME}
          Icon=${APP_NAME}
          Terminal=false
          Categories=Network;FileTransfer;Utility;
          StartupWMClass=${APP_NAME}
          EOF

          # FUSE often isn't usable in CI containers; extract-and-run avoids it.
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./linuxdeploy --appdir "$APPDIR" \
            --executable "$APPDIR/usr/bin/${APP_NAME}" \
            --desktop-file "${APP_NAME}.desktop" \
            "${ICON_ARG[@]}" \
            --output appimage
          # linuxdeploy names it like Rum-x86_64.AppImage; normalize with version.
          mv ${APP_NAME}*.AppImage \
            "dist/${APP_NAME}-${{ steps.ver.outputs.version }}-x86_64.AppImage"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # WINDOWS — wails build, then Inno Setup if available (else raw .exe).
  # ---------------------------------------------------------------------------
  windows:
    name: windows (Setup.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            go.sum
            backend/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
          echo "$(go env GOPATH)\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Derive version from the tag
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build the desktop app (wails)
        shell: pwsh
        run: |
          wails build -clean -platform windows/amd64 -ldflags "-X main.version=${{ steps.ver.outputs.version }}"
          if (-not (Test-Path "build/bin/$env:APP_NAME.exe")) { throw "wails build did not produce build/bin/$env:APP_NAME.exe" }

      - name: Install Inno Setup
        shell: pwsh
        # choco is preinstalled on windows-latest. If this step ever fails we
        # still upload the raw .exe in the next step.
        continue-on-error: true
        run: choco install innosetup -y --no-progress

      - name: Compile the installer (Inno Setup) or fall back to the raw .exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if ($iscc) {
            & $iscc.Source "installer.iss"
            if ($LASTEXITCODE -ne 0) { throw "iscc failed" }
            Copy-Item "build/bin/Rum-Setup.exe" "dist/Rum-Setup-${{ steps.ver.outputs.version }}.exe"
          } else {
            Write-Host "Inno Setup not available — uploading the raw .exe instead."
            Copy-Item "build/bin/$env:APP_NAME.exe" "dist/$env:APP_NAME-${{ steps.ver.outputs.version }}.exe"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # macOS — wails build (universal), then an UNSIGNED .dmg. Best-effort.
  # ---------------------------------------------------------------------------
  macos:
    name: macos (unsigned dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            go.sum
            backend/go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Derive version from the tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build the desktop app (wails, universal)
        run: |
          wails build -clean -platform darwin/universal \
            -ldflags "-X main.version=${{ steps.ver.outputs.version }}"
          # On macOS wails produces a .app bundle under build/bin.
          test -d "build/bin/${APP_NAME}.app"

      - name: Make an UNSIGNED .dmg
        run: |
          set -euo pipefail
          mkdir -p dist
          # create-dmg gives a nicer layout; fall back to plain hdiutil if the
          # brew install fails for any reason. Either way the result is UNSIGNED.
          if brew install create-dmg; then
            create-dmg \
              --volname "${APP_NAME} (unsigned)" \
              --app-drop-link 450 160 \
              --icon "${APP_NAME}.app" 150 160 \
              "dist/${APP_NAME}-${{ steps.ver.outputs.version }}-macOS-unsigned.dmg" \
              "build/bin/${APP_NAME}.app" || HDIUTIL_FALLBACK=1
          else
            HDIUTIL_FALLBACK=1
          fi
          if [ "${HDIUTIL_FALLBACK:-0}" = "1" ]; then
            echo "Falling back to hdiutil for the .dmg"
            staging="$(mktemp -d)"
            cp -R "build/bin/${APP_NAME}.app" "$staging/"
            ln -s /Applications "$staging/Applications"
            hdiutil create -volname "${APP_NAME} (unsigned)" \
              -srcfolder "$staging" -ov -format UDZO \
              "dist/${APP_NAME}-${{ steps.ver.outputs.version }}-macOS-unsigned.dmg"
          fi

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # RELEASE — gather every OS artifact and attach to the GitHub Release.
  # ---------------------------------------------------------------------------
  release:
    name: publish GitHub Release
    runs-on: ubuntu-latest
    needs: [linux, windows, macos]
    # Even if one OS build fails, publish what succeeded rather than nothing.
    if: ${{ always() && (needs.linux.result == 'success' || needs.windows.result == 'success' || needs.macos.result == 'success') }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release with assets
        uses: softprops/action-gh-release@v2
        with:
          # Flatten the per-OS artifact folders into a single asset list.
          files: artifacts/**/*
          fail_on_unmatched_files: false
          generate_release_notes: true
          body: |
            ## Rum ${{ github.ref_name }}

            Prebuilt installers for Linux, Windows and macOS are attached below.

            | OS | Asset |
            |----|-------|
            | Linux | `.AppImage` (portable) or `.deb` |
            | Windows | `Rum-Setup.exe` (or the raw `.exe`) |
            | macOS | `.dmg` — **unsigned, best-effort** |

            macOS is unsigned: after copying Rum to /Applications, clear the
            quarantine flag once with
            `xattr -dr com.apple.quarantine /Applications/Rum.app`.

            See the full change log in
            [docs/IMPROVEMENTS.md](https://github.com/tiredbooy/Rum/blob/master/docs/IMPROVEMENTS.md).
